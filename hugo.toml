# Site avroy.tech, migré depuis Squarespace (carte Vikunja 252).
# Construire : `hugo` (depuis site/) → site/dist/. Prévisualiser : `hugo server`.
baseURL = "https://www.avroy.tech/"
languageCode = "en"
title = "avroy tech"
publishDir = "dist"
disableKinds = ["taxonomy", "term"]
enableRobotsTXT = false
disableHugoGeneratorInject = true

[params]
  tagline = "Navigate Tech Regs"
  email = "hello@avroy.tech"
  linkedin = "https://www.linkedin.com/company/avroytech/"
  twitter = "https://twitter.com/avroytech"
  termsUrl = "http://terms-and-policies.avroy.tech"
  # URL d'un service de formulaires (Formspree, Web3Forms…). Vide : repli par courriel (voir _partials/form.html).
  formEndpoint = ""

[[menus.main]]
  name = "Services"
  url = "/services/"
  weight = 1
[[menus.main]]
  name = "Contact"
  url = "/contact/"
  weight = 2
[[menus.main]]
  name = "Blog"
  url = "/blog/"
  weight = 3
[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 4

# Flux du blog à la même adresse qu'avec la version Eleventy : /blog/feed.xml.
[outputFormats.RSS]
  baseName = "feed"
[outputs]
  home = ["HTML"]
  section = ["HTML", "RSS"]
  page = ["HTML"]

[markup.goldmark]
  # Les articles contiennent des intégrations (iframes Google Slides, Coda) en HTML brut.
  [markup.goldmark.renderer]
    unsafe = true
  # Texte repris tel quel de Squarespace : pas de guillemets ou tirets « typographiques » ajoutés.
  [markup.goldmark.extensions]
    linkify = false
    typographer = false

[sitemap]
  changeFreq = ""
  priority = -1
